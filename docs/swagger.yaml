      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Category'
        "400":
          description: invalid request body or invalid category id
          schema:
            type: string
        "409":
          description: category name is already used
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a category
      tags:
      - categories
  /api/v1/users:
