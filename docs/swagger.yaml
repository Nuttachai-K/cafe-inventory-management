            type: string
        "409":
          description: category has dependent records
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - categories
    get:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Category'
        "400":
          description: invalid category id
          schema:
            type: string
        "404":
          description: data not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Get a category by id
      tags:
      - categories
