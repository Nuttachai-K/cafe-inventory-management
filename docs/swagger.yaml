          schema:
            properties:
              id:
                type: integer
              message:
                type: string
            type: object
        "400":
          description: invalid request body
          schema:
            type: string
        "409":
          description: email is already used
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
