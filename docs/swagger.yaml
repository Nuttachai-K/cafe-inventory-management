          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              id:
                type: integer
              message:
                type: string
            type: object
        "400":
          description: invalid request body
          schema:
            type: string
        "409":
          description: category name is already used
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a category
      tags:
      - categories
